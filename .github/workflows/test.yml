name: Tests

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      AGENT_SMITH_PYTHON: python
      POSTGRES_BIN: /usr/lib/postgresql/17/bin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install native PostgreSQL and pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-17-pgvector

      - name: Lint and run backend tests in a temporary native cluster
        run: ./audit.sh --backend-only

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd services/client && npm ci

      - name: Lint
        run: cd services/client && npm run lint

      - name: Run frontend tests
        run: cd services/client && npm test

      - name: Install Chromium for browser regressions
        run: cd services/client && npx playwright install --with-deps chromium

      - name: Build frontend and run offline browser regressions
        run: cd services/client && npm run test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-artifacts
          path: |
            services/client/playwright-report/
            services/client/test-results/
          retention-days: 7

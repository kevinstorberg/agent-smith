name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agent_smith_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL_TEST: postgresql://postgres@localhost/agent_smith_test

    steps:
      - uses: actions/checkout@v4

      - name: Create test env file
        run: echo "DATABASE_URL_TEST=postgresql://postgres@localhost/agent_smith_test" > .env.test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Run backend tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd services/client && npm ci

      - name: Lint
        run: cd services/client && npm run lint

      - name: Run frontend tests
        run: cd services/client && npm test

      - name: Build frontend
        run: cd services/client && npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker build
        run: docker build -t agent-smith-test .

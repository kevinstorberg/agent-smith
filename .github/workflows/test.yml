name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: ${{ matrix.name }}
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python lint
            check: lint
          - name: Backend tests
            check: tests
          - name: Database health
            check: health

    env:
      AGENT_SMITH_PYTHON: python
      POSTGRES_BIN: /usr/lib/postgresql/17/bin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install native PostgreSQL and pgvector
        if: matrix.check == 'tests' || matrix.check == 'health'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-17-pgvector

      - name: Lint Python
        if: matrix.check == 'lint'
        run: python -m ruff check .

      - name: Run backend tests in a temporary native cluster
        if: matrix.check == 'tests'
        run: ./audit.sh --backend-only --skip-lint

      - name: Check database health in a temporary native cluster
        if: matrix.check == 'health'
        run: ./audit.sh --backend-only --skip-lint -k 'database_health or memory_pgvector_schema or migration'

  frontend:
    name: ${{ matrix.name }}
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Frontend lint
            script: lint
          - name: Frontend typecheck
            script: typecheck
          - name: Frontend build
            script: build:bundle
          - name: Frontend unit tests
            script: test
          - name: Browser regressions
            script: test:browser

    defaults:
      run:
        working-directory: services/client

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser regressions
        if: matrix.script == 'test:browser'
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: npm run ${{ matrix.script }}

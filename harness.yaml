agents:
  claude:
    rules:
      targets:
        - path: ~/.claude/CLAUDE.md
          compose:
            - harness/main.md
            - harness/rules/shared/
            - harness/rules/claude/
        - path: ~/.claude/rules/
          copy:
            - harness/rules/shared/
            - harness/rules/claude/

  codex:
    rules:
      targets:
        - path: ~/.codex/AGENTS.md
          compose:
            - harness/main.md
            - harness/rules/shared/
            - harness/rules/codex/

  gemini:
    rules:
      targets:
        - path: ~/.gemini/GEMINI.md
          compose:
            - harness/main.md
            - harness/rules/shared/
            - harness/rules/gemini/

# Files within each directory are concatenated in lexicographic order.
# Use underscore-separated names without numeric prefixes (e.g. dry.md, tracer_bullets.md).

agents:
  claude:
    rules:
      targets:
        - path: ~/.claude/CLAUDE.md
          compose:
            - harness/main.md
            - harness/rules/shared/
            - harness/rules/claude/
        - path: ~/.claude/rules/
          copy:
            - harness/rules/shared/
            - harness/rules/claude/
    skills:
      targets:
        - path: ~/.claude/skills/
          copy:
            - harness/skills/shared/
            - harness/skills/claude/
    mcp:
      targets:
        - path: ~/.claude.json
          merge:
            - harness/mcp/shared/
            - harness/mcp/claude/

  codex:
    rules:
      targets:
        - path: ~/.codex/AGENTS.md
          compose:
            - harness/main.md
            - harness/rules/shared/
            - harness/rules/codex/
    skills:
      targets:
        - path: ~/.codex/skills/
          copy:
            - harness/skills/shared/
            - harness/skills/codex/
    mcp:
      targets:
        - path: ~/.codex/config.toml
          merge:
            - harness/mcp/shared/
            - harness/mcp/codex/

  gemini:
    rules:
      targets:
        - path: ~/.gemini/GEMINI.md
          compose:
            - harness/main.md
            - harness/rules/shared/
            - harness/rules/gemini/
    skills:
      targets:
        - path: ~/.gemini/skills/
          copy:
            - harness/skills/shared/
            - harness/skills/gemini/
    mcp:
      targets:
        - path: ~/.gemini/settings.json
          merge:
            - harness/mcp/shared/
            - harness/mcp/gemini/

# Files within each directory are concatenated in lexicographic order.
# Use underscore-separated names without numeric prefixes (e.g. dry.md, tracer_bullets.md).

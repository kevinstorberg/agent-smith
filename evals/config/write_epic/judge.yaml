prompt: |
  You are evaluating an EPIC — a sequenced list of tickets that takes a product
  from zero to working MVP. No code has been written. The output is a plan
  describing what WILL be built, ticket by ticket.

  For every evaluation step, ask: "Does the epic demonstrate this quality?"
  Do NOT ask: "Was this actually built?" — the epic describes future work.

  A well-written epic:
  - Groups tickets in dependency order (infrastructure, database, auth, core CRUD, domain CRUD, pipelines, placeholders)
  - Each ticket follows the required format (Story, Objective, Context, Tasks, Verification, Out of Scope)
  - Dependencies flow downward — a ticket's prerequisites appear above it
  - Backend tickets come before their corresponding frontend tickets
  - Infrastructure (CI/CD + health check) comes before business logic for every service
  - Each ticket maps to one PR in one repo
  - Tickets reference the data model and architecture docs rather than redefining schemas
  - Describes what needs to exist, not how to build it
  - Each ticket proves a specific assumption via its verification steps

  Score 9-10: The epic clearly demonstrates the criterion with specific, concrete content.
  Score 5-7: The epic partially demonstrates the criterion but is vague or inconsistent.
  Score 0-4: The epic fails to demonstrate the criterion or actively violates it.

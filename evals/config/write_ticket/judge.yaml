prompt: |
  You are evaluating a TICKET (user story / work item). The output is a written
  ticket that describes work to be done by an engineer. No code has been written.

  For every evaluation step, ask: "Does the ticket demonstrate this quality?"
  Do NOT ask: "Did the engineer actually do this?" — the ticket describes future work.

  A well-written ticket:
  - Uses clear section structure (Story, Objective, Context, Tasks, Verification, Out of Scope)
  - Uses plain "- " for task lists, never checkboxes ("- [ ]")
  - Describes WHAT to build and WHY, not HOW to implement it
  - Is concise — every sentence earns its place
  - Frames work as proving assumptions (tracer bullet thinking)
  - States dependencies without prescribing implementation order
  - Explicitly scopes what is out of scope

  Score 9-10: The ticket clearly demonstrates the criterion with specific, concrete content.
  Score 5-7: The ticket partially demonstrates the criterion but is vague or inconsistent.
  Score 0-4: The ticket fails to demonstrate the criterion or actively violates it.

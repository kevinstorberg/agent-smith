scenarios:
  - name: backend_api_endpoint
    enabled: true
    prompt: |
      Write a ticket for adding a new REST API endpoint to an existing Python FastAPI
      application. The endpoint should allow users to export their transaction history
      as a CSV file. The app already has a transactions table, an auth middleware, and
      a query builder utility.

  - name: frontend_search_redesign
    enabled: true
    prompt: |
      Write a ticket for redesigning the search experience on an e-commerce React
      application. Users currently see a simple text input with no autocomplete. The
      product team wants typeahead suggestions, recent search history, and category
      filtering. The frontend uses React 18 with TanStack Query for data fetching.

  - name: infrastructure_cicd_pipeline
    enabled: true
    prompt: |
      Write a ticket for setting up a CI/CD pipeline for a Python monorepo that
      currently has no automated deployment. The repo contains a FastAPI backend, a
      React frontend, and shared Python libraries. Deployments are currently done
      manually via SSH. The team uses GitHub and AWS.

  - name: data_migration
    enabled: true
    prompt: |
      Write a ticket for migrating user profile data from a legacy MySQL database to
      a new PostgreSQL database. The legacy schema uses a single wide table with 47
      columns. The new schema normalizes this into users, addresses, and preferences
      tables. There are approximately 2 million user records. The migration must happen
      with zero downtime.

  - name: bug_fix_race_condition
    enabled: true
    prompt: |
      Write a ticket for fixing a race condition in a payment processing service. When
      two requests arrive simultaneously for the same user, both can pass the balance
      check and create withdrawals, resulting in a negative balance. The service uses
      Python, FastAPI, and PostgreSQL. The issue has been reproduced in staging and
      affects approximately 0.1% of transactions.

  - name: observability_setup
    enabled: true
    prompt: |
      Write a ticket for adding structured logging and distributed tracing to a
      microservices architecture. The system has 5 Python services communicating via
      REST and RabbitMQ. Currently, logs are unstructured print statements and there
      is no request correlation across services. The team wants to use OpenTelemetry.

  - name: auth_token_rotation
    enabled: true
    prompt: |
      Write a ticket for implementing refresh token rotation in an existing Django
      authentication system. The app currently uses long-lived JWT access tokens (24h
      expiry) with no refresh mechanism. The security team requires short-lived access
      tokens (15min) with rotating refresh tokens and the ability to revoke all sessions
      for a user.

  - name: performance_optimization
    enabled: true
    prompt: |
      Write a ticket for optimizing a slow dashboard page in a Django application.
      The page loads user analytics data and currently takes 8-12 seconds. Profiling
      shows N+1 queries (loading related objects in a loop), no database indexes on
      filtered columns, and a large JSON serialization step. The page must load in
      under 2 seconds.

scenarios:
  - name: build_a_todo_app
    enabled: true
    prompt: |
      Plan the implementation of a simple command-line todo list application in Python.
      It should support add, list, complete, and delete operations, storing todos in a
      JSON file.

  - name: plan_user_auth
    enabled: true
    prompt: |
      Plan the implementation of a user authentication system with JWT tokens
      and refresh token rotation for a Python FastAPI application.

  - name: build_cli_expense_tracker
    enabled: true
    prompt: |
      Plan the implementation of a command-line expense tracker in Python. It should
      support adding expenses with amount, category, and description; importing
      transactions from CSV files; listing expenses with filters by date range and
      category; and generating monthly summary reports. Data is persisted to a local
      JSON file.

  - name: plan_webhook_processor
    enabled: true
    prompt: |
      Plan the implementation of a webhook ingestion service in Python. It receives
      HTTP POST requests from third-party services (Stripe, GitHub, Slack), validates
      request signatures using HMAC-SHA256, queues events for processing, dispatches
      them to type-specific handlers, and ensures idempotent processing so duplicate
      deliveries do not cause side effects. Use Flask or FastAPI.

  - name: plan_markdown_static_site
    enabled: true
    prompt: |
      Plan the implementation of a static site generator in Python. It reads markdown
      files from a content directory, applies Jinja2 templates, supports front matter
      (title, date, tags), generates an index page and individual post pages as HTML,
      and copies static assets to the output directory. It should be runnable as a CLI
      command.

  - name: plan_api_rate_limiter
    enabled: true
    prompt: |
      Plan the implementation of a rate limiting middleware for a Python FastAPI
      application. It should support sliding window rate limits, per-user and per-IP
      limiting, configurable limits per endpoint, and a pluggable backend (in-memory
      for development, Redis for production). Return appropriate HTTP 429 responses
      with Retry-After headers.

  - name: plan_data_pipeline
    enabled: true
    prompt: |
      Plan the implementation of a data ingestion pipeline in Python. It reads records
      from multiple sources (CSV files and a REST API), validates and transforms each
      record (normalizing dates, cleaning strings, rejecting malformed rows), deduplicates
      by a composite key, and loads the results into a PostgreSQL database. It should be
      runnable as a CLI command with progress reporting.

  - name: plan_chat_bot_framework
    enabled: true
    prompt: |
      Plan the implementation of a pluggable chatbot framework in Python. It should
      support registering command handlers (e.g., /help, /weather, /remind), a middleware
      chain for logging, auth checks, and rate limiting, conversation state management
      per user, and multiple transport adapters (CLI for testing, WebSocket for
      production). Messages flow through the middleware chain before reaching handlers.

  - name: add_search_to_flask_app
    enabled: true
    prompt: |
      Plan adding full-text search to an existing Flask application that uses PostgreSQL
      and SQLAlchemy. The app already has a QueryBuilder class in lib/query_builder.py
      with filter_by(), sort_by(), and paginate() methods used by the product listing
      endpoint. Some routes still use raw SQL string concatenation instead of the
      QueryBuilder. The search feature should support querying product names and
      descriptions, with results paginated and sorted by relevance.

  - name: plan_file_sync_daemon
    enabled: true
    prompt: |
      Plan the implementation of a background file synchronization daemon in Python. It
      watches a local directory for changes (new files, modifications, deletions), computes
      SHA-256 checksums to detect changes, maintains a local manifest of known file states,
      and syncs changes to a remote S3-compatible object store via boto3. It should handle
      conflicts (local and remote both changed), support a dry-run mode, and be configurable
      via a YAML config file. It runs as a long-lived process with configurable poll intervals.

  - name: plan_permission_system
    enabled: true
    prompt: |
      Plan the implementation of a role-based access control (RBAC) permission system for
      an existing Python Django application. The app currently has a simple is_admin boolean
      on the User model. The new system should support named roles (admin, editor, viewer),
      granular permissions per resource type (e.g., can_edit_posts, can_delete_comments),
      role inheritance (admin inherits all editor permissions), and a decorator for
      protecting views. The migration must preserve existing admin users' access.

  - name: plan_notification_aggregator
    enabled: true
    prompt: |
      Plan the implementation of a notification aggregation service in Python. It collects
      events from multiple internal services via a message queue (Redis pub/sub or RabbitMQ),
      batches them per user over a configurable time window, renders notification content
      using templates, and delivers via email (SMTP) and in-app (WebSocket push). Users can
      configure per-channel preferences (email only, in-app only, both, mute). Include a
      dead letter queue for failed deliveries with retry logic.

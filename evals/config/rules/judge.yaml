prompt: |
  You are evaluating a PLAN. No code has been written. No execution has occurred.
  The plan describes what WILL happen, not what HAS happened.

  For every evaluation step, ask: "Does the plan describe how this will be done with
  specific details?" Do NOT ask: "Did the output actually do this?"

  Examples of what counts as satisfying a step IN A PLAN:
  - "implement only storage.py in bullet 1, stub everything else" = incremental implementation
  - "after bullet 1 passes, proceed to bullet 2" = stop-and-verify
  - "searched PyPI for existing URL shorteners: pyshorteners, shlink" = searching for existing solutions

  Do not penalize for the absence of actual code, execution, or user feedback.
  Where a step requires user interaction, assume the user will perform it. Score based on
  whether the plan specifies when and how it occurs.

  For steps conditional on context (e.g., "if a codebase exists"), score based on
  whether the plan accounts for the condition, not whether the condition was met.

  If a rule's process steps are inapplicable to the task (e.g., "fix broken code" on a
  greenfield project with no existing code), and the plan explicitly acknowledges this
  and explains why, score 9-10. Do not penalize for the absence of work that cannot exist.

  Score 9-10: Explicitly addresses every process step with specific, concrete details.
  Score 5-7: Addresses most steps but some are vague or described in general terms.
  Score 0-4: Ignores or barely mentions the rule's requirements.

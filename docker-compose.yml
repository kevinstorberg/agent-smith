x-postgres-image: &postgres-image postgres:17

services:
  app:
    build: .
    ports:
      - "${DASHBOARD_PORT:-7654}:${DASHBOARD_PORT:-7654}"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      DASHBOARD_PORT: "${DASHBOARD_PORT:-7654}"
    env_file:
      - .env.default
      - path: .env.production
        required: false
    volumes:
      - memory_store:/app/memory_store
      - ${RDS_CERT_PATH:-/dev/null}:/certs/rds-global-bundle.pem:ro
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json
      - ${HOME}/.codex:/root/.codex
      - ${HOME}/.gemini:/root/.gemini
      - ${HOME}:${HOME}

  postgres:
    image: *postgres-image
    profiles: [local-db]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-agent_smith}"
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-agent_smith}"]
      interval: 2s
      timeout: 5s
      retries: 10

  test-db:
    image: *postgres-image
    profiles: [test]
    environment:
      POSTGRES_DB: agent_smith_test
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_smith_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  lint:
    build: .
    profiles: [lint]
    entrypoint: ["ruff", "check", "."]

  frontend:
    build:
      context: .
      target: frontend
    profiles: [frontend]
    working_dir: /app/services/client
    volumes:
      - ./services/client:/app/services/client
      - /app/services/client/node_modules

  test:
    build: .
    profiles: [test]
    depends_on:
      test-db:
        condition: service_healthy
    environment:
      APP_ENV: test
    env_file:
      - .env.default
      - .env.test
    entrypoint: ["python", "-m", "pytest", "tests/", "-v"]

volumes:
  pgdata:
  memory_store:

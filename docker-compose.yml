services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env.default
      - .env.development
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: agent_smith
      POSTGRES_PASSWORD: agent_smith
      POSTGRES_DB_DEVELOPMENT: agent_smith_dev
      DATABASE_URL_DEVELOPMENT: ""
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent_smith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_smith}
      POSTGRES_DB: ${POSTGRES_DB_DEVELOPMENT:-agent_smith_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_smith"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  frontend:
    image: node:22-alpine
    profiles:
      - frontend
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:${APP_PORT:-8000}}
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/ui/}
    depends_on:
      app:
        condition: service_started
    volumes:
      - .:/app

volumes:
  pgdata:

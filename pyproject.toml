[project]
name = "agent_smith"
version = "0.1.0"
description = "Agent Smith local control plane for agent configuration, memory, evals, plans, jobs, and sync workflows"
authors = [{name = "SonderMind Engineering"}]
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[project.scripts]
agent-smith = "scripts.cli:main"

[tool.poetry]
packages = [
    {include = "src"},
    {include = "config"},
    {include = "db"},
    {include = "memory"},
    {include = "cache"},
    {include = "assets"},
    {include = "lib"},
    {include = "scripts"},
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = {version = "^0.136.3", extras = ["standard"]}
uvicorn = "^0.34.0"
pydantic = "^2.0"
pydantic-settings = "^2.6.0"
python-dotenv = "^1.0.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"
psycopg2-binary = "^2.9"
httpx = "^0.28.0"
pyyaml = "^6.0.1"
structlog = "^24.0"
apscheduler = "^3.11.0"
websockets = "^15.0.0"
langgraph = "^1.2.4"
nest-asyncio = "^1.6.0"
langchain-core = "^1.4.0"
langchain-openai = "^1.2.2"
langchain-anthropic = "^1.4.4"
langchain = ">=0.3.0"
langchain-classic = ">=0.3.0"
langchain-community = ">=0.3.0"
langchain-huggingface = ">=0.1.0"
langchain-pinecone = ">=0.2.0"
sentence-transformers = ">=3.0.0"
pyjwt = "^2.8"
mcp = {version = ">=1.0", extras = ["cli"]}
lancedb = ">=0.17.0"
deepeval = ">=2.9.3"
google-generativeai = ">=0.8.0"
graphviz = ">=0.20"
tomli-w = ">=1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
ruff = "^0.8.0"
respx = "^0.22.0"
pre-commit = "^4.6.0"
pip-audit = "^2.10.0"

[tool.poetry.group.aws]
optional = true

[tool.poetry.group.aws.dependencies]
boto3 = "^1.34.0"

[tool.poetry.group.redis]
optional = true

[tool.poetry.group.redis.dependencies]
redis = "^5.0.0"

[tool.poetry.group.pinecone]
optional = true

[tool.poetry.group.pinecone.dependencies]
pinecone = ">=7.0.0"

[tool.poetry.group.pgvector]
optional = true

[tool.poetry.group.pgvector.dependencies]
pgvector = "^0.3.0"

[tool.poetry.group.documentdb]
optional = true

[tool.poetry.group.documentdb.dependencies]
pymongo = "^4.15.0"

[tool.poetry.group.graph-postgres]
optional = true

[tool.poetry.group.graph-postgres.dependencies]
langgraph-checkpoint-postgres = "^3.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
    ".claude",
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.coverage.run]
source = ["src", "lib", "db", "memory", "cache", "assets"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers -v"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may need DB or network)",
    "e2e: End-to-end tests (full stack, may need API keys)",
    "eval: Evaluation tests (LLM-as-judge, skip by default)",
]
